<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 420" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Inter, system-ui, sans-serif;">
  <defs>
    <!-- Marker Panah -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <!-- Filter Shadow Halus -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header Judul Diagram -->
  <rect x="0" y="0" width="1500" height="60" fill="#0f172a" />
  <text x="750" y="38" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="0.5">3.a FLOWCHART PROSES LOGIN ADMIN KE DASHBOARD</text>

  <!-- ================= 1. MULAI ================= -->
  <g transform="translate(85, 180)" filter="url(#shadow)">
    <rect x="-55" y="-22" width="110" height="44" rx="22" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Mulai</text>
  </g>

  <!-- Panah 1 -> 2 -->
  <line x1="140" y1="180" x2="185" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 2. INPUT USERNAME & PASSWORD ================= -->
  <g transform="translate(265, 180)" filter="url(#shadow)">
    <rect x="-80" y="-28" width="160" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Input Username</text>
    <text x="0" y="14" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">&amp; Password</text>
  </g>

  <!-- Panah 2 -> 3 -->
  <line x1="345" y1="180" x2="385" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 3. DECISION: DATA LOGIN VALID? ================= -->
  <g transform="translate(460, 180)" filter="url(#shadow)">
    <polygon points="0,-48 75,0 0,48 -75,0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" fill="#1e3a8a" font-size="11.5" font-weight="bold">Data login</text>
    <text x="0" y="13" text-anchor="middle" fill="#1e3a8a" font-size="11.5" font-weight="bold">valid?</text>
  </g>

  <!-- Label 'Ya' -->
  <text x="548" y="172" fill="#16a34a" font-size="12" font-weight="bold">Ya</text>

  <!-- Panah 3 -> 4 (Ya) -->
  <line x1="535" y1="180" x2="575" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cabang 'Tidak' -> Box Pesan Gagal -->
  <line x1="460" y1="228" x2="460" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="468" y="250" fill="#dc2626" font-size="12" font-weight="bold">Tidak</text>

  <!-- Box Pesan Gagal -->
  <g transform="translate(460, 310)" filter="url(#shadow)">
    <rect x="-75" y="-24" width="150" height="48" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="0" y="-3" text-anchor="middle" fill="#991b1b" font-size="11.5" font-weight="bold">Tampilkan pesan</text>
    <text x="0" y="13" text-anchor="middle" fill="#991b1b" font-size="11.5" font-weight="bold">login gagal</text>
  </g>

  <!-- Loop back dari Pesan Gagal ke Input -->
  <path d="M 385 310 L 265 310 L 265 215" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ================= 4. BUAT SESSION LOGIN ================= -->
  <g transform="translate(650, 180)" filter="url(#shadow)">
    <rect x="-70" y="-28" width="140" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">Buat session</text>
    <text x="0" y="14" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">login &amp; log</text>
  </g>

  <!-- Panah 4 -> 5 -->
  <line x1="720" y1="180" x2="760" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 5. DASHBOARD ADMIN ================= -->
  <g transform="translate(825, 180)" filter="url(#shadow)">
    <rect x="-65" y="-28" width="130" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Dashboard</text>
    <text x="0" y="14" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Admin</text>
  </g>

  <!-- Panah 5 -> 6 -->
  <line x1="890" y1="180" x2="930" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 6. DECISION: PILIH TINDAKAN ================= -->
  <g transform="translate(995, 180)" filter="url(#shadow)">
    <polygon points="0,-42 65,0 0,42 -65,0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" fill="#1e3a8a" font-size="11.5" font-weight="bold">Pilih</text>
    <text x="0" y="13" text-anchor="middle" fill="#1e3a8a" font-size="11.5" font-weight="bold">tindakan?</text>
  </g>

  <!-- Label 'Logout' -->
  <text x="1068" y="172" fill="#d97706" font-size="11.5" font-weight="bold">Logout</text>

  <!-- Panah 6 -> 7 (Logout) -->
  <line x1="1060" y1="180" x2="1115" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 7. HAPUS SESSION ================= -->
  <g transform="translate(1175, 180)" filter="url(#shadow)">
    <rect x="-60" y="-26" width="120" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="0" y="5" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Hapus session</text>
  </g>

  <!-- Panah 7 -> 8 -->
  <line x1="1235" y1="180" x2="1275" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 8. REDIRECT KE LOGIN ================= -->
  <g transform="translate(1335, 180)" filter="url(#shadow)">
    <rect x="-60" y="-26" width="120" height="52" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="0" y="-3" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">Redirect ke</text>
    <text x="0" y="13" text-anchor="middle" fill="#0f172a" font-size="11" font-weight="bold">halaman login</text>
  </g>

  <!-- Panah 8 -> 9 -->
  <line x1="1395" y1="180" x2="1430" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 9. SELESAI ================= -->
  <g transform="translate(1460, 180)" filter="url(#shadow)">
    <rect x="-35" y="-22" width="70" height="44" rx="22" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Selesai</text>
  </g>

  <!-- Footer Keterangan -->
  <text x="750" y="395" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">Standar Alur Sistem PT Sawala Inovasi Indonesia &bull; Ujikom RPL SMKN 1 Majalengka &bull; Hanan Aria Santagama</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 440" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Inter, system-ui, sans-serif;">
  <defs>
    <!-- Marker Panah -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <!-- Filter Shadow Halus -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header Judul Diagram -->
  <rect x="0" y="0" width="1620" height="60" fill="#0f172a" />
  <text x="810" y="38" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="0.5">3.b FLOWCHART INPUT DATA, VALIDASI SLUG, DAN PENERBITAN (PUBLISH) PORTOFOLIO UMKM</text>

  <!-- ================= 1. MULAI ================= -->
  <g transform="translate(70, 180)" filter="url(#shadow)">
    <rect x="-45" y="-22" width="90" height="44" rx="22" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Mulai</text>
  </g>

  <!-- Panah 1 -> 2 -->
  <line x1="115" y1="180" x2="155" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 2. DASHBOARD & MENU ================= -->
  <g transform="translate(225, 180)" filter="url(#shadow)">
    <rect x="-70" y="-28" width="140" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Dashboard Admin</text>
    <text x="0" y="14" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">&gt; Buat Web Baru</text>
  </g>

  <!-- Panah 2 -> 3 -->
  <line x1="295" y1="180" x2="335" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 3. INPUT PROFIL, SLUG & PRODUK ================= -->
  <g transform="translate(435, 180)" filter="url(#shadow)">
    <rect x="-100" y="-32" width="200" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="0" y="-12" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">Pilih Template Visual,</text>
    <text x="0" y="4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">Input Profil, Kontak,</text>
    <text x="0" y="20" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">Logo, Produk &amp; Slug</text>
  </g>

  <!-- Panah 3 -> 4 -->
  <line x1="535" y1="180" x2="575" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 4. DECISION: DATA VALID? ================= -->
  <g transform="translate(645, 180)" filter="url(#shadow)">
    <polygon points="0,-48 70,0 0,48 -70,0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="-3" text-anchor="middle" fill="#1e3a8a" font-size="11.5" font-weight="bold">Data input</text>
    <text x="0" y="13" text-anchor="middle" fill="#1e3a8a" font-size="11.5" font-weight="bold">valid?</text>
  </g>

  <!-- Label 'Ya' -->
  <text x="726" y="172" fill="#16a34a" font-size="12" font-weight="bold">Ya</text>

  <!-- Panah 4 -> 5 (Ya) -->
  <line x1="715" y1="180" x2="755" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cabang 'Tidak' Valid -> Box Error -->
  <line x1="645" y1="228" x2="645" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="653" y="250" fill="#dc2626" font-size="12" font-weight="bold">Tidak</text>

  <!-- Box Pesan Error Input -->
  <g transform="translate(645, 310)" filter="url(#shadow)">
    <rect x="-70" y="-24" width="140" height="48" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="0" y="-3" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="bold">Tampilkan pesan</text>
    <text x="0" y="13" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="bold">kesalahan form</text>
  </g>

  <!-- Loop back Error Input ke Form -->
  <path d="M 575 310 L 435 310 L 435 220" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ================= 5. DECISION: SLUG TERSEDIA? ================= -->
  <g transform="translate(835, 180)" filter="url(#shadow)">
    <polygon points="0,-48 80,0 0,48 -80,0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="bold">Cek Database:</text>
    <text x="0" y="6" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="bold">Slug</text>
    <text x="0" y="20" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="bold">tersedia?</text>
  </g>

  <!-- Label 'Ya' -->
  <text x="926" y="172" fill="#16a34a" font-size="12" font-weight="bold">Ya</text>

  <!-- Panah 5 -> 6 (Ya) -->
  <line x1="915" y1="180" x2="955" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cabang 'Tidak' (Slug Sudah Dipakai) -->
  <line x1="835" y1="228" x2="835" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="843" y="250" fill="#dc2626" font-size="12" font-weight="bold">Tidak</text>

  <!-- Box Pesan Slug Duplikat -->
  <g transform="translate(835, 310)" filter="url(#shadow)">
    <rect x="-80" y="-24" width="160" height="48" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="0" y="-3" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="bold">Tampilkan notifikasi</text>
    <text x="0" y="13" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="bold">slug sudah dipakai</text>
  </g>

  <!-- Loop back Slug Error ke Form -->
  <path d="M 755 310 L 485 310 L 485 220" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ================= 6. STATUS PUBLISH ================= -->
  <g transform="translate(1025, 180)" filter="url(#shadow)">
    <rect x="-65" y="-28" width="130" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">Set status</text>
    <text x="0" y="14" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">'publish'</text>
  </g>

  <!-- Panah 6 -> 7 -->
  <line x1="1090" y1="180" x2="1125" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 7. SIMPAN KE MYSQL ================= -->
  <g transform="translate(1185, 180)" filter="url(#shadow)">
    <rect x="-60" y="-28" width="120" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Simpan ke</text>
    <text x="0" y="14" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">database MySQL</text>
  </g>

  <!-- Panah 7 -> 8 -->
  <line x1="1245" y1="180" x2="1280" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 8. CATAT LOG AKTIVITAS ================= -->
  <g transform="translate(1345, 180)" filter="url(#shadow)">
    <rect x="-65" y="-28" width="130" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">Catat aktivitas</text>
    <text x="0" y="14" text-anchor="middle" fill="#0f172a" font-size="11.5" font-weight="bold">audit trail</text>
  </g>

  <!-- Panah 8 -> 9 -->
  <line x1="1410" y1="180" x2="1440" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 9. TAMPILKAN URL PORTOFOLIO ================= -->
  <g transform="translate(1505, 180)" filter="url(#shadow)">
    <rect x="-65" y="-28" width="130" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" fill="#14532d" font-size="11.5" font-weight="bold">Tampilkan URL</text>
    <text x="0" y="14" text-anchor="middle" fill="#14532d" font-size="11.5" font-weight="bold">web aktif</text>
  </g>

  <!-- Panah 9 -> 10 -->
  <line x1="1570" y1="180" x2="1595" y2="180" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 10. SELESAI ================= -->
  <g transform="translate(1625, 180)" filter="url(#shadow)">
    <rect x="-30" y="-22" width="60" height="44" rx="22" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="11.5" font-weight="bold">Selesai</text>
  </g>

  <!-- Footer Keterangan -->
  <text x="810" y="405" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">Standar Alur Sistem PT Sawala Inovasi Indonesia &bull; Ujikom RPL SMKN 1 Majalengka &bull; Hanan Aria Santagama</text>
</svg>

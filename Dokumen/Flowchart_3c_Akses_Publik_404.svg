<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 450" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', Inter, system-ui, sans-serif;">
  <defs>
    <!-- Marker Panah -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <!-- Filter Shadow Halus -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Header Judul Diagram -->
  <rect x="0" y="0" width="1450" height="60" fill="#0f172a" />
  <text x="725" y="38" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="0.5">3.c FLOWCHART AKSES PUBLIK HALAMAN PORTOFOLIO DAN PENANGANAN 404</text>

  <!-- ================= 1. MULAI ================= -->
  <g transform="translate(75, 170)" filter="url(#shadow)">
    <rect x="-45" y="-22" width="90" height="44" rx="22" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">Mulai</text>
  </g>

  <!-- Panah 1 -> 2 -->
  <line x1="120" y1="170" x2="160" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 2. PENGUNJUNG MEMBUKA URL ================= -->
  <g transform="translate(240, 170)" filter="url(#shadow)">
    <rect x="-80" y="-28" width="160" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Pengunjung</text>
    <text x="0" y="14" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">membuka URL/slug</text>
  </g>

  <!-- Panah 2 -> 3 -->
  <line x1="320" y1="170" x2="360" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 3. AMBIL SLUG DARI URL ================= -->
  <g transform="translate(435, 170)" filter="url(#shadow)">
    <rect x="-75" y="-28" width="150" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Ambil slug</text>
    <text x="0" y="14" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">dari URL request</text>
  </g>

  <!-- Panah 3 -> 4 -->
  <line x1="510" y1="170" x2="550" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 4. CARI DI DATABASE ================= -->
  <g transform="translate(630, 170)" filter="url(#shadow)">
    <rect x="-80" y="-28" width="160" height="56" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="0" y="-4" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">Cari portofolio</text>
    <text x="0" y="14" text-anchor="middle" fill="#0f172a" font-size="12" font-weight="bold">berdasarkan slug</text>
  </g>

  <!-- Panah 4 -> 5 -->
  <line x1="710" y1="170" x2="750" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 5. DECISION: DATA DITEMUKAN & PUBLISH? ================= -->
  <g transform="translate(835, 170)" filter="url(#shadow)">
    <polygon points="0,-50 85,0 0,50 -85,0" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="0" y="-12" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="bold">Data ditemukan</text>
    <text x="0" y="4" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="bold">&amp; status</text>
    <text x="0" y="18" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="bold">published?</text>
  </g>

  <!-- Label 'Ya' -->
  <text x="930" y="162" fill="#16a34a" font-size="12" font-weight="bold">Ya</text>

  <!-- Panah 5 -> 6 (Ya) -->
  <line x1="920" y1="170" x2="980" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= 6. TAMPILKAN WEB UMKM (SUCCESS) ================= -->
  <g transform="translate(1085, 170)" filter="url(#shadow)">
    <rect x="-105" y="-30" width="210" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
    <text x="0" y="-5" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">Tampilkan halaman</text>
    <text x="0" y="13" text-anchor="middle" fill="#14532d" font-size="12" font-weight="bold">portofolio web UMKM</text>
  </g>

  <!-- Panah 6 -> SELESAI -->
  <line x1="1190" y1="170" x2="1325" y2="170" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cabang 'Tidak' (Tidak Ditemukan / Draft) -->
  <line x1="835" y1="220" x2="835" y2="280" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="843" y="250" fill="#dc2626" font-size="12" font-weight="bold">Tidak</text>

  <!-- ================= 7. DECISION: CEK RIWAYAT SLUG LAMA (SEO 301) ================= -->
  <g transform="translate(835, 330)" filter="url(#shadow)">
    <polygon points="0,-45 75,0 0,45 -75,0" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <text x="0" y="-10" text-anchor="middle" fill="#854d0e" font-size="10.5" font-weight="bold">Cek Riwayat:</text>
    <text x="0" y="5" text-anchor="middle" fill="#854d0e" font-size="10.5" font-weight="bold">Ada di slug</text>
    <text x="0" y="18" text-anchor="middle" fill="#854d0e" font-size="10.5" font-weight="bold">lama?</text>
  </g>

  <!-- Label 'Ya' (SEO 301) -->
  <text x="920" y="295" fill="#16a34a" font-size="11.5" font-weight="bold">Ya</text>

  <!-- Panah 7 -> Box Redirect 301 -->
  <path d="M 910 330 L 980 330 L 980 290 L 1020 290" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box Redirect 301 -->
  <g transform="translate(1090, 290)" filter="url(#shadow)">
    <rect x="-70" y="-24" width="140" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="0" y="-3" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="bold">Redirect 301 ke</text>
    <text x="0" y="13" text-anchor="middle" fill="#1e3a8a" font-size="11" font-weight="bold">slug baru</text>
  </g>

  <!-- Panah dari Redirect 301 ke Selesai -->
  <path d="M 1160 290 L 1365 290 L 1365 205" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Label 'Tidak' (Benar-benar 404) -->
  <text x="920" y="380" fill="#dc2626" font-size="11.5" font-weight="bold">Tidak</text>

  <!-- Panah 7 -> Box 404 -->
  <path d="M 910 330 L 980 330 L 980 380 L 1020 380" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 404 Not Found -->
  <g transform="translate(1090, 380)" filter="url(#shadow)">
    <rect x="-70" y="-24" width="140" height="48" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="0" y="-3" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="bold">Tampilkan halaman</text>
    <text x="0" y="13" text-anchor="middle" fill="#991b1b" font-size="11" font-weight="bold">404 Not Found</text>
  </g>

  <!-- Panah dari 404 ke Selesai -->
  <path d="M 1160 380 L 1365 380 L 1365 205" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ================= 8. SELESAI ================= -->
  <g transform="translate(1365, 170)" filter="url(#shadow)">
    <rect x="-40" y="-22" width="80" height="44" rx="22" fill="#0f172a" stroke="#0f172a" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">Selesai</text>
  </g>

  <!-- Footer Keterangan -->
  <text x="725" y="430" text-anchor="middle" fill="#64748b" font-size="11" font-weight="600">Standar Alur Sistem PT Sawala Inovasi Indonesia &bull; Ujikom RPL SMKN 1 Majalengka &bull; Hanan Aria Santagama</text>
</svg>
